# Deploy Flutter web to GitHub Pages.
#
# First-time repo setup:
# 1. Push this workflow to GitHub (branch: main).
# 2. Repo → Settings → Pages → Build and deployment → Source: "GitHub Actions".
# 3. Default URL is https://<user>.github.io/<repo>/ — base-href matches automatically.
#
# API for the live site (required):
# Your Oracle REST server must be reachable over HTTPS from the browser (GitHub Pages is https://).
# Repo → Settings → Secrets and variables → Actions → Variables (or Secrets):
#   ORACLE_API_BASE_URL = https://your-api.example.com   (no trailing slash)
# Example: https://couch-api.onrender.com
# Do NOT use http://localhost:... — visitors' browsers will call their own machine, not your server.

name: Deploy web to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      base_href:
        description: "flutter --base-href (leave empty for /repo-name/; use / for custom domain at site root)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Resolve base href
        id: base
        env:
          DISPATCH_BASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.base_href || '' }}
        run: |
          INPUT="$DISPATCH_BASE"
          VAR='${{ vars.PAGES_BASE_HREF }}'
          REPO='${{ github.event.repository.name }}'
          if [ -n "$INPUT" ]; then
            echo "href=$INPUT" >> "$GITHUB_OUTPUT"
          elif [ -n "$VAR" ]; then
            echo "href=$VAR" >> "$GITHUB_OUTPUT"
          else
            echo "href=/$REPO/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build web
        env:
          ORACLE_API_BASE_URL: ${{ secrets.ORACLE_API_BASE_URL || vars.ORACLE_API_BASE_URL }}
        run: |
          ORACLE="$(echo -n "$ORACLE_API_BASE_URL" | tr -d '\r')"
          if [ -z "$ORACLE" ]; then
            echo "::error::Missing ORACLE_API_BASE_URL. Add it under Repo → Settings → Secrets and variables → Actions (Variable or Secret) so the web build can call your backend."
            exit 1
          fi
          echo "Building with ORACLE_API_BASE_URL length: ${#ORACLE}"
          # --csp: GitHub Pages (and strict CSP) block eval(); this build mode avoids that.
          flutter build web --release --csp --no-wasm-dry-run --base-href "${{ steps.base.outputs.href }}" \
            --dart-define=ORACLE_API_BASE_URL="$ORACLE"

      - name: Disable Jekyll (Flutter asset paths)
        run: touch build/web/.nojekyll

      - name: CNAME from repo variable
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: printf '%s\n' '${{ vars.CUSTOM_DOMAIN }}' > build/web/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
