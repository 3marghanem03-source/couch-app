# Deploy Edge Functions to your hosted Supabase project (uses supabase/config.toml).
#
# One-time setup:
# 1. Create an access token: https://supabase.com/dashboard/account/tokens
# 2. Repo → Settings → Secrets and variables → Actions → New repository secret:
#      Name:  SUPABASE_ACCESS_TOKEN
#      Value: (paste token)
# 3. Optional repository Variable: SUPABASE_PROJECT_REF (default below matches this app).
#
# Run: Actions → "Deploy Supabase Edge Functions" → Run workflow.

name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

jobs:
  deploy-generate-training-week:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Deploy generate-training-week
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -e
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing secret SUPABASE_ACCESS_TOKEN. Add it under Repo → Settings → Secrets and variables → Actions."
            echo "Create a token at https://supabase.com/dashboard/account/tokens"
            exit 1
          fi
          REF="${SUPABASE_PROJECT_REF:-fohttdiwlcntblftpttu}"
          echo "Deploying to project ref: $REF"
          # --no-verify-jwt: avoids gateway 401 ES256 / publishable-key issues; auth stays in function code (getUser + coach checks).
          supabase functions deploy generate-training-week --project-ref "$REF" --no-verify-jwt
